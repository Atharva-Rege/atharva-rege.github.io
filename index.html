<!DOCTYPE html>

  <body>

    <canvas id="bg-canvas" aria-hidden="true"></canvas>
    <div class="ambient-blobs" aria-hidden="true">
      <div class="blob blob-violet"></div>
      <div class="blob blob-cyan"></div>
      <div class="blob blob-indigo"></div>

    <header class="site-header">
      <nav class="nav-inner">
        <a class="brand" href="#top">AAR</a>
        <div class="nav-links">

        <p class="credit">Design refreshed with the <code>ui-ux-pro-max</code> Claude skill &middot; originally inspired by
